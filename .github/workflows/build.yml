name: Build BetterSpawners

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew clean build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BetterSpawners-2.0.0
          path: core/build/libs/BetterSpawners-2.0.0.jar
